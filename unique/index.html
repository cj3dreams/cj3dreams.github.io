<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirect to ServiceTitan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background: #f0f2f5;
        }
        .fallback {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #555;
        }
        a {
            color: #1a73e8;
        }
    </style>
</head>
<body>
    <p>Открываю ServiceTitan…</p>
    <script>
        (function() {
            // Пытаемся открыть приложение через кастомную схему
            window.location.href = 'servicetitan://';

            // Если через 2 секунды всё ещё здесь — показываем запасную инструкцию
            setTimeout(function() {
                document.body.innerHTML += `
                    <div class="fallback">
                        ⚠️ Приложение не открылось автоматически.<br>
                        Возможно, требуется подтверждение или приложение не установлено.<br>
                        <a href="servicetitan://">Нажмите здесь, чтобы попробовать вручную</a>
                    </div>
                `;
            }, 2000);
        })();
    </script>
</body>
</html>
